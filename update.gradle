import com.ancientmc.acpgen.tasks.mapping.UpdateCsv

repositories {
    mavenCentral()
}

configurations {
    rosetta
}

dependencies {
    rosetta "com.ancientmc:rosetta:$rosetta_version:all"
}

ext {
    OLD_DIR = String.join('/', 'data/versions', phase(old_version as String), old_version)
    NEW_DIR = String.join('/', 'data/versions', phase(new_version as String), new_version)
    NEW_CFG = String.join('/', NEW_DIR, 'mappings/rosetta.cfg')
    NEW_JAR = String.join('/', NEW_DIR, 'game/jars/client.jar')
    NEW_INHERITANCE = String.join('/', NEW_DIR, 'inheritance_map.json')
    OLD_TSRG = String.join('/', OLD_DIR, 'mappings/intermediate.tsrg')
    NEW_TSRG = String.join('/', NEW_DIR, 'mappings/intermediate.tsrg')
    OLD_IDS = String.join('/', OLD_DIR, 'mappings/ids.csv')
    NEW_IDS = String.join('/', NEW_DIR, 'mappings/ids.csv')
    OLD_CSV_DIR = String.join('/', OLD_DIR, 'mappings/csv/')
    NEW_CSV_DIR = String.join('/', NEW_DIR, 'mappings/csv/')
    MATCH = 'data/matches/' + old_version + '-' + new_version + '.match'
}

tasks.register('setupNewVersion', Copy) {
    group = 'update'
    destinationDir = file(NEW_DIR)
    from (OLD_DIR + '/game/jardep.json') { into ('/game/') }
    from (OLD_DIR + '/mappings/rosetta.cfg') { into ('/mappings/') }
    from (OLD_DIR + '/inject/intermediate/') { into ('/inject/intermediate/') }
    from (OLD_DIR + '/inject/blacklist.txt') { into ('/inject/') }
    from (OLD_DIR + '/run/src/main/java/acp/client/') { into ('/run/src/main/java/acp/client/')}
    doLast {
        file(NEW_DIR + '/inject/access.txt/').withWriter('UTF-8') { w -> w.write('') }
        file(NEW_DIR + '/inject/exceptions.txt/').withWriter('UTF-8') { w -> w.write('') }
    }
}

tasks.register('updateTsrg', JavaExec) {
    group = 'update'
    mainClass = 'com.ancientmc.rosetta.Rosetta'
    classpath = files(project.configurations.named('rosetta'))
    args('update', NEW_CFG, NEW_JAR, NEW_INHERITANCE, OLD_TSRG, OLD_IDS, MATCH, NEW_TSRG, NEW_IDS)
}

def csvs = ['classes', 'fields', 'methods', 'params']
csvs.each { table ->
    tasks.register("update${table.capitalize()}Csv", UpdateCsv) {
        group = 'update'
        input = file(OLD_CSV_DIR + '/' + table + '.csv')
        blankOutput = file(NEW_CSV_DIR + '/' + table + '.csv')
        output = file(NEW_CSV_DIR + '/' + table + '.csv')
    }
}

/**
 * new_version version -> writeCsvs *before* running this!
 */
tasks.register('updateAllCsvs') {
    group = 'update'
    dependsOn(updateClassesCsv, updateMethodsCsv, updateFieldsCsv, updateParamsCsv)
}

static def phase(String ver) {
    if (ver.startsWith('c')) return 'classic'
    if (ver.startsWith('in-')) return 'indev'
    if (ver.startsWith('inf-')) return 'infdev'
    if (ver.startsWith('a')) return 'alpha'
    if (ver.startsWith('b')) return 'beta'
    if (ver.contains('w') || ver.contains('pre')) return 'snapshot'
    return 'release'
}

