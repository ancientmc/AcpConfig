plugins {
    id 'java-library'
    id "de.undercouch.download" version "5.6.0"
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net' }
    maven { url = 'https://github.com/ancientmc/ancientmc-maven/raw/maven/' }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'commons-io:commons-io:2.18.0'
    implementation 'org.ow2.asm:asm:9.7.1'
    implementation 'org.ow2.asm:asm-tree:9.7.1'
    implementation 'net.minecraftforge:mapping-verifier:2.0.8:fatjar'
    implementation 'net.minecraftforge:srgutils:0.5.4'
}

import com.ancientmc.acpconfig.tasks.*
import com.ancientmc.acpconfig.tasks.csv.*
import com.ancientmc.acpconfig.util.*

ext {
    VERSION_ONE = 'c0.0.13a_03' // The old version // TODO: replace this dual-version thing with a more complex (but better) subproject hierarchy.
    VERSION_TWO = 'c0.0.14a_08' // The new version

    VERSION_MANIFEST = 'data/version_manifest.json' // TODO: replace with custom manifest for versions not in launcher
}



task downloadVersionManifest(type: Download) {
    src 'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'
    dest VERSION_MANIFEST
}

subprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net' }
        maven { url = 'https://github.com/ancientmc/ancientmc-maven/raw/maven/' }
    }

    configurations {
        inheritance
        jarsplitter
        forgeart
        mcinject
    }

    dependencies {
        inheritance "net.neoforged.installertools:installertools:3.0.2"
        jarsplitter 'net.neoforged.installertools:jarsplitter:3.0.2'
        forgeart 'net.neoforged:AutoRenamingTool:2.0.8'
        mcinject 'de.oceanlabs.mcp:mcinjector:4.1-am'
    }

    ext {
        VERSION = project.name
    }

    // Init paths
    Paths paths = new Paths(VERSION)

    task downloadJson(type: Download, dependsOn: rootProject.downloadVersionManifest) {
        src Json.getJarUrl(file(paths.VERSION_MANIFEST), VERSION).toString()
        dest paths.JSON
    }

    task downloadClient(type: Download, dependsOn: downloadJson) {
        src Json.getJarUrl(file(paths.JSON), "client").toString()
        dest paths.BASE_JAR
    }

    task downloadLibraries(type: DownloadLibraries, dependsOn: downloadJson){
        def list = Collections.singletonList(file(Paths.JSON))
        jsons = list
        libs = file(paths.DIR_LIBRARIES)
    }

    task extractInheritance(type: JavaExec, dependsOn: downloadClient) {
        mainClass = 'net.neoforged.installertools.ConsoleTool'
        classpath = files(project.configurations.named('inheritance'))
        args('--task', 'EXTRACT_INHERITANCE', '--input', paths.BASE_JAR, '--output', paths.INHERITANCE)
    }

    // Only generate if the version to update is radically different than the previous one.
    // Otherwise we'll just match and update. Also, make sure to check the inheritance map first for any access errors so inheritance is intact.
    task writeTsrg(type: WriteTsrg, dependsOn: downloadClient) {
        jar = file(paths.BASE_JAR)
        tsrg = file(paths.INTERMEDIATE_TSRG)
        inheritanceJson = file(paths.INHERITANCE)
    }

    task split(type: JavaExec, dependsOn: [downloadClient, writeTsrg]) {
        mainClass = 'net.neoforged.jarsplitter.ConsoleTool'
        classpath = files(project.configurations.getByName('jarsplitter'))
        args('--input', paths.BASE_JAR, '--slim', paths.SLIM_JAR, '--extra', paths.EXTRA_JAR, '--srg', paths.INTERMEDIATE_TSRG)
    }

    task verify(type: VerifyMappings, dependsOn: [split, writeTsrg]) {
        jar = file(paths.SLIM_JAR)
        tsrg = file(paths.INTERMEDIATE_TSRG)
    }

    task mcinject(type: JavaExec, dependsOn: split) {
        mainClass = 'de.oceanlabs.mcp.mcinjector.MCInjector'
        classpath = files(project.configurations.named('mcinject'))
        args('--in', paths.SLIM_JAR, '--out', paths.INJECT_JAR, '--lvt=LVT', '--exc', paths.EXC, '--blacklist', paths.BLACKLIST)
    }

    task deobfIntermediate(type: JavaExec, dependsOn: mcinject) {
        mainClass = 'net.neoforged.art.Main'
        classpath = files(project.configurations.getByName('forgeart'))
        args('--input', paths.INJECT_JAR, '--output', paths.SRG_JAR, '--map', paths.INTERMEDIATE_TSRG, '--src-fix', '--strip-sigs')
    }

    task writeCsvs(type: WriteCsvs, dependsOn: [split, extractInheritance]) {
        tsrg = file(paths.INTERMEDIATE_TSRG)
        classCsv = file("${Paths.DIR_VERSION}/mappings/csv/classes.csv")
        fieldCsv = file("${Paths.DIR_VERSION}/mappings/csv/fields.csv")
        methodCsv = file("${Paths.DIR_VERSION}/mappings/csv/methods.csv")
        paramCsv = file("${Paths.DIR_VERSION}/mappings/csv/params.csv")
    }

    def csvs = [Paths.CLASS_CSV, Paths.FIELD_CSV, Paths.METHOD_CSV, Paths.PARAM_CSV]
    csvs.each { table ->
        int i = csvs.indexOf(table)
        def name = table.substring(table.lastIndexOf('/') + 1).replace('.csv', "").capitalize()
        def temp = "${Paths.DIR_VERSION}/mappings/temp/temp-" + i + ".tsrg";

        // This is garbage and needs to be refactored
        def applyCsv = task "apply${name}"(type: ApplyCsv) {
            csv = file(table)
            inTsrg = i == 0 ? file(Paths.INTERMEDIATE_TSRG) : file(temp)
            outTsrg = i == 3 ? file(Paths.CUNEIFORM_TSRG) : file("${Paths.DIR_VERSION}/mappings/temp/temp-" + (i + 1) + ".tsrg")
            mustRunAfter i != 0 ? "apply${csvs.get(i - 1).substring(table.lastIndexOf('/') + 1).replace('.csv', "").capitalize()}" : [:]
        }
    }

    def csvTasks = ["applyClasses", "applyFields", "applyMethods", "applyParams"]
    task applyAllCsv (type: GradleBuild) {
        setTasks(csvTasks)
    }

    task deobfMapped (type: JavaExec, dependsOn: applyAllCsv) {
        mainClass = 'net.neoforged.art.Main'
        classpath = files(project.configurations.getByName('forgeart'))
        args('--input', paths.INJECT_JAR, '--output', paths.CNF_JAR, '--map', paths.CUNEIFORM_TSRG, '--src-fix', '--strip-sigs')
    }
}
